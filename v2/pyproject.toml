[tool.poetry]
name = "iptv-api-v2"
version = "2.1.0"
description = "IPTV-API v2 - Atomic streaming architecture for IPTV source discovery and ranking"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "core"}]

[tool.poetry.dependencies]
python = "^3.13"
aiohttp = "^3.13.3"
m3u8 = "^6.0.0"
flask = "^3.1.3"
gunicorn = "^23.0.0"
pytz = "^2025.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
mypy = "^1.13"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["v2/core/tests"]
pythonpath = ["v2"]
asyncio_mode = "auto"
addopts = "--cov=core --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["v2/core"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
